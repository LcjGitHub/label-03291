# 前端 8081，后端 8080。若接入后端服务，可取消注释 backend 并依赖它。
# 数据库若使用 MySQL，建议映射 3307:3306 避免宿主机 3306 占用。
services:
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      # 构建多架构时使用: docker buildx build --platform linux/amd64,linux/arm64
    container_name: customer-mgmt-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - app-network

  # 后端服务（若存在可取消注释，端口 8080）
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - DB_HOST=db
  #     - DB_PORT=3306
  #   networks:
  #     - app-network

  # 数据库（若需要，建议宿主机端口用 3307 避免占用）
  # db:
  #   image: mysql:8.0
  #   ports:
  #     - "3307:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: app
  #     MYSQL_CHARACTER_SET_SERVER: utf8mb4
  #     MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge
